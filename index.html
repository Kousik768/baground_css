<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AVENGERS</title>
    <style>
        *{
    padding: 0px;
    margin:0px;
    box-sizing: border-box;
    background-size: cover;
    background-repeat: no-repeat;
    background-image: url("./avengers.jpg");
    background-repeat: no-repeat;
    background-size: cover;
}


h1{
    text-align: center;
    color: rgb(243, 7, 35);
    text-shadow: 6px 8px 5px rgb(9, 9, 9);
    text-indent: -10%;

}
.c1{
    height: 280px;
    width: 320px;
    background-image: url("./ironman.jpg");
    background-size: cover;
    background-repeat: no-repeat;
    box-shadow: 7px 7px 10px rgb(211, 17, 17);
    background-position: right;
    padding-left: 40px;
    
}

.c2{
    height: 280px;
    width: 320px;
    /* background-color: violet; */
    background-image: url("./spiderman.jpg");
    background-size: cover;
    background-repeat: no-repeat;
    box-shadow: 7px 7px 10px crimson;
    background-position: right;
    
    position: absolute;
    top: 10px;
    right: 20px;
    
}


.c3{
        height: 400px;
    width: 570px;
    /* background-color: violet; */
    background-image: url("./hulk.jpg");
    background-size: cover;
    background-repeat: no-repeat;
    box-shadow: 10px 10px 13px crimson;
    background-position: right;
    
    position: absolute;
    top: 10px;
    left: 35%;
    
}

.c4{
    height: 280px;
    width: 320px;
    background-image: url("./thor.jfif");
    background-size: cover;
    background-repeat: no-repeat;
    box-shadow: 7px 7px 10px crimson;
    position: absolute;
    top: 360px;
    left: 20px;
    
}

.c5{
    height: 280px;
    width: 320px;
    background-image: url("./wanda.jfif");
    background-size: cover;
    background-repeat: no-repeat;
    box-shadow: 7px 7px 10px crimson;
    background-color: violet;
    position: absolute;
    top: 400px;
    right: 35px;
}
    </style>
</head>
<body>
   
    <h1 style="color: #a50000;">AVENGERS</h1>
    <div class="c1"></div>
    <div class="c2"></div>
    <div class="c3"></div>
    <div class="c4"></div>
    <div class="c5"></div>
    
</body>
</html>
